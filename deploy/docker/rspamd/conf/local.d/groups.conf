group "sentinelmail" {
  description = "SentinelMail policy decisions";

  symbols = {
    "SMG_SENDER_ALLOWLIST" {
      weight = -20.0;
      description = "Sender matched a SentinelMail allowlist";
      one_shot = true;
    }
    "SMG_SENDER_BLACKLIST" {
      weight = 20.0;
      description = "Sender matched a SentinelMail blocklist";
      one_shot = true;
    }
    "SMG_QUARANTINED" {
      weight = 20.0;
      description = "SentinelMail quarantined the message";
      one_shot = true;
    }
    "SMG_REJECTED" {
      weight = 20.0;
      description = "SentinelMail rejected the message";
      one_shot = true;
    }
    "SMG_TAGGED" {
      weight = 0.0;
      description = "SentinelMail tagged the message";
      one_shot = true;
    }
  }
}
