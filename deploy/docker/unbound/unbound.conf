server:
  # Use a high, unprivileged port so the resolver can run without root or
  # NET_BIND_SERVICE. It is reachable only on the private Compose network.
  interface: 0.0.0.0@5353
  port: 5353
  do-ip4: yes
  do-ip6: no
  do-udp: yes
  do-tcp: yes

  username: "unbound"
  chroot: ""
  directory: "/etc/unbound"
  pidfile: ""
  use-syslog: no
  verbosity: 1

  # Docker bridge networks are private-address space. Refuse any other client
  # even if a future deployment accidentally publishes the resolver port.
  access-control: 0.0.0.0/0 refuse
  access-control: 10.0.0.0/8 allow
  access-control: 172.16.0.0/12 allow
  access-control: 192.168.0.0/16 allow
  access-control: 127.0.0.0/8 allow

  # Full recursion is intentional: DNS reputation providers reject queries
  # relayed through shared/public forwarders. Do not add a forwarding section.
  # Unbound's built-in root hints bootstrap recursion; Alpine's dnssec-root
  # package seeds the RFC 5011 trust anchor in the image. Do not mount a named
  # volume over /var/lib/unbound: stale rollover state can mask the current
  # packaged anchors and make every validating recursive query return SERVFAIL.
  auto-trust-anchor-file: "/var/lib/unbound/root.key"
  harden-dnssec-stripped: yes
  harden-glue: yes
  harden-referral-path: yes
  qname-minimisation: yes
  aggressive-nsec: yes
  prefetch: yes
  prefetch-key: yes
  serve-expired: yes
  serve-expired-ttl: 3600
  cache-min-ttl: 30
  cache-max-ttl: 86400

  hide-identity: yes
  hide-version: yes
  unwanted-reply-threshold: 100000
